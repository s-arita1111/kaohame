<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>絵巻顔ハメ体験</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #1a1a1a; color: white; 
            font-family: sans-serif; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-height: 100vh; overflow: hidden;
        }

        h2 { margin: 10px 0; font-size: 1.2rem; font-weight: normal; }

        /* メインコンテナ */
        #app-container { 
            position: relative; width: 100vw; max-width: 800px; 
            aspect-ratio: 4 / 3; background: #000; overflow: hidden;
        }
        
        video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 1; transform: scaleX(-1); /* 自撮りしやすいよう鏡面にする */
        }
        
        #overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 2; pointer-events: none; object-fit: contain;
        }

        .controls { margin-top: 20px; display: flex; gap: 15px; z-index: 10; }

        button { 
            padding: 12px 24px; font-size: 16px; border-radius: 50px; border: none; 
            cursor: pointer; font-weight: bold;
        }

        #switch { background: #ffffff; color: #333; }
        #capture { background: #ff4757; color: white; }

        /* --- 撮影後のプレビュー画面（隠し要素） --- */
        #preview-container {
            display: none; /* 最初は隠す */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center;
        }

        #preview-image { 
            width: 90%; max-width: 600px; border: 3px solid white; border-radius: 10px;
        }

        .preview-msg { margin: 20px; text-align: center; font-size: 14px; line-height: 1.6; }
        
        #back-btn { background: #555; color: white; margin-top: 10px; }

        canvas { display: none; }
    </style>
</head>
<body>

    <h2>絵巻顔ハメ体験</h2>

    <div id="app-container">
        <video id="video" autoplay playsinline muted></video>
        <img id="overlay" src="tesutosozai.png" alt="frame">
    </div>

    <div class="controls">
        <button id="switch">カメラ切替</button>
        <button id="capture">撮影する</button>
    </div>

    <div id="preview-container">
        <div class="preview-msg">
            <strong>撮影成功！</strong><br>
            画像を<strong>長押し</strong>して「"写真"に追加」または「保存」を選択してください。
        </div>
        <img id="preview-image" src="" alt="preview">
        <button id="back-btn">もう一度撮る</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('overlay');
        const switchBtn = document.getElementById('switch');
        const captureBtn = document.getElementById('capture');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const backBtn = document.getElementById('back-btn');
        
        let currentFacingMode = "user";

        async function initCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            try {
                // 自撮り(user)の場合は鏡面、外カメラ(environment)の場合は通常に戻す
                video.style.transform = (currentFacingMode === "user") ? "scaleX(-1)" : "scaleX(1)";
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("カメラの起動に失敗しました。設定を確認してください。");
            }
        }

        switchBtn.onclick = () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            initCamera();
        };

        captureBtn.onclick = () => {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // 1. カメラ映像を描画
            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0); // リセット
            
            // 2. 絵巻画像を重ねる
            ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

            // 3. プレビュー画面を表示
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            previewImage.src = dataUrl;
            previewContainer.style.display = 'flex';
        };

        // プレビューから戻るボタン
        backBtn.onclick = () => {
            previewContainer.style.display = 'none';
        };

        initCamera();
    </script>
</body>
</html>
