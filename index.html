<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>絵巻顔ハメ体験</title>
    <style>
        /* 全体のレイアウト設定 */
        body { 
            margin: 0; 
            padding: 0;
            background: #1a1a1a; 
            color: white; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h2 { margin: 10px 0; font-size: 1.2rem; font-weight: normal; letter-spacing: 0.1rem; }

        /* 顔ハメを表示するコンテナ */
        #app-container { 
            position: relative; 
            width: 100vw; 
            max-width: 800px; /* PCでの最大幅 */
            aspect-ratio: 4 / 3; /* 絵巻物の比率に合わせて調整 */
            background: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        /* 背面：カメラ映像 */
        video { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* 隙間なく表示 */
            z-index: 1;
        }
        
        /* 前面：顔をくり抜いた絵巻画像 */
        #overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
            pointer-events: none; /* 画像の下の要素（ビデオ等）を邪魔しない */
            object-fit: contain; /* 絵巻全体を画面内に収める */
        }

        /* 操作ボタン */
        .controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 15px; 
            z-index: 10;
        }

        button { 
            padding: 12px 24px; 
            font-size: 16px; 
            border-radius: 50px; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.95); }

        #switch { background: #ffffff; color: #333; }
        #capture { background: #ff4757; color: white; }

        /* 保存用の隠しキャンバス */
        canvas { display: none; }
    </style>
</head>
<body>

    <h2>絵巻顔ハメ体験</h2>

    <div id="app-container">
        <video id="video" autoplay playsinline muted></video>
        <img id="overlay" src="tesutosozai.png" alt="frame">
    </div>

    <div class="controls">
        <button id="switch">カメラ切替</button>
        <button id="capture">撮影して保存</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('overlay');
        const switchBtn = document.getElementById('switch');
        const captureBtn = document.getElementById('capture');
        
        let currentFacingMode = "user"; // スマホでは最初は自撮りモード

        // カメラの初期化
        async function initCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("カメラのアクセスに失敗しました:", err);
                // ローカル環境(file://)ではここでエラーになるのが正常です
            }
        }

        // カメラ（イン・アウト）切り替え
        switchBtn.onclick = () => {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            initCamera();
        };

        // 撮影処理
        captureBtn.onclick = () => {
            const ctx = canvas.getContext('2d');
            
            // 解像度をビデオのサイズに合わせる
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // 1. カメラ映像を描画
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 2. 絵巻画像を重ねて描画（ビデオのサイズにフィットさせる）
            ctx.drawImage(overlay, 0, 0, canvas.width, canvas.height);

            // 3. ブラウザでダウンロードを実行
            const link = document.createElement('a');
            link.download = `emaki_photo_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
        };

        initCamera();
    </script>
</body>
</html>
